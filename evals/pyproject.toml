[project]
name = "handshake-evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "docker",
    "handshake",
    "huggingface-hub",
    "jsonschema",
    "requests",
    "swebench==4.1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.uv.sources]
handshake = { path = "..", editable = true }
